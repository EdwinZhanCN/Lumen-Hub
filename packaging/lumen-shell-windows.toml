name = "lumen-shell"
product_name = "Lumen Hub"
identifier = "org.lumilio.lumen-hub"
# WiX/MSI requires a numeric fourth version component. cargo-packager maps
# SemVer build metadata to that fourth component, so 0.1.0+3 becomes 0.1.0.3.
version = "0.1.0+3"
out_dir = "../dist/shell"
binaries_dir = "../target/release"
before_packaging_command = "cargo build --release -p lumen-shell"
formats = ["wix"]
license_file = "../LICENSE"

[[binaries]]
path = "lumen-shell"
main = true
