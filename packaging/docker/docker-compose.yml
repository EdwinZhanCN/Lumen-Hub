# Lumen Hub — example compose file.
#
# Pick ONE image tag for your hardware (see packaging/docker/README.md):
#   :cpu     any machine (x64 + arm64)            — no extra host setup
#   :vulkan  Intel iGPU (Skylake+) or AMD GPU     — uncomment the vulkan block
#   :cuda    NVIDIA GPU                           — uncomment the cuda block,
#            host needs nvidia-container-toolkit

services:
    lumen-hub:
        image: ghcr.io/edwinzhancn/lumen-hub:cpu
        restart: unless-stopped
        ports:
            - "50051:50051"
        volumes:
            - lumen-models:/models
            # Optional: replace the baked-in default config (SigLIP+face+OCR):
            # - ./lumen-config.yaml:/etc/lumen/config.yaml:ro

        # --- vulkan (Intel iGPU / AMD) ---------------------------------------
        # devices:
        #     - /dev/dri:/dev/dri
        # group_add:
        #     # The container user must be in the host's render group. Its GID
        #     # varies by distro — find yours with:  getent group render
        #     - "render"

        # --- cuda (NVIDIA) ----------------------------------------------------
        # deploy:
        #     resources:
        #         reservations:
        #             devices:
        #                 - driver: nvidia
        #                   count: all
        #                   capabilities: [gpu]

volumes:
    lumen-models:
