name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    workspace:
        name: fmt + test (cpu)
        # 22.04 to match the Linux dist build floor (see release.yml) — no
        # artifacts ship from this job, but keeping it aligned avoids CI
        # passing on a newer glibc than what actually gets released.
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.94.1"
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
            - uses: extractions/setup-just@v4
              with:
                  just-version: "1.58.0"
            - name: Workspace CI
              run: just ci

    backends:
        name: build ${{ matrix.backend }} (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - backend: cpu
                      os: ubuntu-22.04
                    # No separate `vulkan` job: burn's Vulkan/Metal/Wgpu backends
                    # are the same cubecl-wgpu code parameterized by GraphicsApi
                    # (Vulkan/Metal/AutoGraphicsApi) — checking `wgpu` (auto) here
                    # compiles the identical generic instantiation an explicit
                    # `vulkan` feature check would, so it was pure duplication.
                    - backend: wgpu
                      os: ubuntu-22.04
                    - backend: metal
                      os: macos-15
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.94.1"
            - uses: Swatinem/rust-cache@v2
            - uses: extractions/setup-just@v4
              with:
                  just-version: "1.58.0"
            - name: Backend CI
              run: just ci-backend ${{ matrix.backend }}

    # Deterministic protocol check: committed provenance, package major, buf
    # lint, and generated daemon drift. Remote SDK/tag and fixed-baseline proof
    # lives in proto-contract.yml and runs only at the dependency boundary.
    contract:
        name: proto contract check
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.94.1"
            - uses: Swatinem/rust-cache@v2
            - uses: extractions/setup-just@v4
              with:
                  just-version: "1.58.0"
            - name: Install buf
              run: |
                  curl -sSL https://github.com/bufbuild/buf/releases/download/v1.72.0/buf-Linux-x86_64 -o /usr/local/bin/buf
                  chmod +x /usr/local/bin/buf
                  buf --version
            - name: Proto contract check
              run: just contract

    # CUDA / ROCm require vendor toolkits to compile (cubecl-cuda / cubecl-rocm)
    # and are not exercised on hosted runners; they are validated on
    # self-hosted GPU machines out-of-band.
