name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    workspace:
        name: fmt + test (cpu)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.94.1"
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
            - name: Format
              run: cargo fmt --all -- --check
            # Default backend is `cpu` (burn-ndarray). E2E model tests skip
            # gracefully when LUMEN_MODELS_DIR has no assets, so the workspace
            # suite is self-contained on CI.
            - name: Test workspace
              run: cargo test --workspace

            # L0 e2e: real binary + mock model repo + QA fixture model (no
            # weight downloads). The qa feature is test-only; dist profiles
            # never enable it.
            - name: L0 e2e suites (cpu)
              run: >
                  cargo test -p lumen-hub --features qa
                  --test l0_lifecycle --test l0_infer --test l0_batcher
                  --test l0_control --test l0_contract

    backends:
        name: build ${{ matrix.backend }} (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - backend: cpu
                      os: ubuntu-24.04
                    - backend: wgpu
                      os: ubuntu-24.04
                    - backend: vulkan
                      os: ubuntu-24.04
                    - backend: metal
                      os: macos-15
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.94.1"
            - uses: Swatinem/rust-cache@v2
            # Verify lumen-hub compiles with the full model set on each backend.
            - name: Check backend
              run: >
                  cargo check -p lumen-hub --no-default-features
                  --features ${{ matrix.backend }},siglip,ppocr,insightface,clip

            # Metal runners have a real GPU: run the L0 e2e suites on the
            # metal backend so cpu↔metal behavior is exercised on every PR.
            - name: L0 e2e suites (metal)
              if: matrix.backend == 'metal'
              run: >
                  cargo test -p lumen-hub --no-default-features
                  --features metal,siglip,ppocr,insightface,clip,qa
                  --test l0_lifecycle --test l0_infer --test l0_batcher
                  --test l0_control --test l0_contract

    # CUDA / ROCm require vendor toolkits to compile (cubecl-cuda / cubecl-rocm)
    # and are not exercised on hosted runners; they are validated on
    # self-hosted GPU machines out-of-band.
