name: Release Profiles

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            release_tag:
                description: Planned release tag for the dry run (for example, v0.1.0)
                required: true
                type: string

permissions:
    contents: read

env:
    RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
    validate-release:
        name: validate-release-input
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Validate planned release tag
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                    echo "release tag must look like v0.1.0 or v0.1.0-rc.1: $RELEASE_TAG" >&2
                    exit 1
                  fi
                  PACKAGE_VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' crates/lumen-cli/Cargo.toml | head -n1)"
                  if [[ -z "$PACKAGE_VERSION" || "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
                    echo "release tag $RELEASE_TAG does not match lumen-cli version ${PACKAGE_VERSION:-unknown}" >&2
                    exit 1
                  fi
                  echo "Release build tag: $RELEASE_TAG"
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                    echo "Mode: dry run (no GitHub Release and no container push)"
                  else
                    echo "Mode: publish"
                  fi

    # Burn statically links its compute backend, so each hub archive is just the
    # binaries + warmup assets + license (no ONNX Runtime / MNN libraries).
    # `*-gpu` = wgpu (Vulkan/GL/DX12 at runtime). `cuda`/`rocm` install their
    # vendor toolkit in-job (no GPU needed to build). `jetson` is the arm64 CUDA
    # build done inside an L4T container for ABI-correct Tegra artifacts. GPU
    # profiles are build-and-package only; GPU E2E happens on self-hosted runners.
    dist:
        name: hub-${{ matrix.profile }}
        runs-on: ${{ matrix.os }}
        container: ${{ matrix.container }}
        needs:
            - validate-release
        strategy:
            fail-fast: false
            matrix:
                include:
                    # macOS
                    - { profile: darwin-arm64-metal, os: macos-15 }
                    - { profile: darwin-arm64-cpu, os: macos-15 }
                    # Windows
                    - { profile: windows-x64-cpu, os: windows-2025 }
                    - { profile: windows-x64-gpu, os: windows-2025 }
                    # Linux x64 — built on the oldest glibc we can (22.04/2.35, not
                    # 24.04/2.39): glibc is forward-compatible only, so an older build
                    # host maximizes which end-user distros the shipped binary runs on.
                    # 20.04 is not an option: GitHub retired the ubuntu-20.04 hosted
                    # runner in April 2025, and AMD's ROCm 7.1.1 apt repo doesn't
                    # publish a focal channel either — 22.04 is the actual floor.
                    - { profile: linux-x64-cpu, os: ubuntu-22.04 }
                    - { profile: linux-x64-gpu, os: ubuntu-22.04 }
                    - { profile: linux-x64-cuda, os: ubuntu-22.04, toolkit: cuda }
                    - { profile: linux-x64-rocm, os: ubuntu-22.04, toolkit: rocm }
                    # Linux arm64
                    - { profile: linux-arm64-cpu, os: ubuntu-22.04-arm }
                    - { profile: linux-arm64-gpu, os: ubuntu-22.04-arm }
                    - {
                          profile: linux-arm64-jetson,
                          os: ubuntu-24.04-arm,
                          container: "nvcr.io/nvidia/l4t-cuda:12.2.12-devel",
                      }

        steps:
            - name: Install container base deps
              if: matrix.container != ''
              run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates build-essential pkg-config git

            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            # dtolnay's action needs a normal runner; inside the L4T container we
            # bootstrap rustup directly.
            - name: Install Rust (host runner)
              if: matrix.container == ''
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.94.1"

            - name: Install Rust (container)
              if: matrix.container != ''
              run: |
                  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.94.1 --profile minimal
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

            - name: Install CUDA toolkit
              if: matrix.toolkit == 'cuda'
              uses: Jimver/cuda-toolkit@v0.2.21
              with:
                  method: network

            # cubecl-hip-sys 7.1.5280200 (pinned by cubecl-hip 0.10) ships HIP
            # 52802 bindings, which require ROCm 7.1.1 — its build.rs reads
            # `hipconfig --version` and enables the matching feature, so the
            # installed ROCm must match exactly (7.1.0 bindings are unreleased).
            - name: Install ROCm toolkit
              if: matrix.toolkit == 'rocm'
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install -y wget gnupg
                  sudo mkdir -p /etc/apt/keyrings
                  wget -qO - https://repo.radeon.com/rocm/rocm.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
                  echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.1.1 jammy main' | sudo tee /etc/apt/sources.list.d/rocm.list
                  # Ubuntu's universe repo ships conflicting rocminfo/rocm-cmake/hipcc
                  # versions; prefer the AMD repo so the SDK's pinned deps resolve.
                  printf 'Package: *\nPin: origin "repo.radeon.com"\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm-pin-600
                  sudo apt-get update
                  # rocm-hip-sdk pulls the runtime/headers; hipcc ships the
                  # `hipconfig` utility that cubecl-hip-sys runs at build time.
                  sudo apt-get install -y rocm-hip-sdk hipcc
                  # ROCm 7.x installs to /opt/rocm-<ver>; rocm-hip-sdk alone does
                  # not always create the /opt/rocm symlink, so resolve the real
                  # install dir instead of hardcoding it.
                  ROCM_DIR="$(ls -d /opt/rocm /opt/rocm-* 2>/dev/null | sort -V | tail -n1)"
                  test -n "$ROCM_DIR" || { echo "no ROCm install under /opt"; exit 1; }
                  echo "Resolved ROCm at: $ROCM_DIR"
                  # cubecl-hip-sys runs `hipconfig` from PATH (not from ROCM_PATH),
                  # and its location varies across ROCm layouts. Find it and put
                  # its directory on PATH so the build can derive the link paths.
                  HIPCONFIG="$(find "$ROCM_DIR" /opt/rocm* -name hipconfig -type f 2>/dev/null | head -n1)"
                  if [ -z "$HIPCONFIG" ]; then
                      echo "hipconfig not found; ROCm bin layout:" >&2
                      ls -la "$ROCM_DIR/bin" 2>/dev/null | grep -i hip >&2 || true
                      exit 1
                  fi
                  echo "Found hipconfig at: $HIPCONFIG"
                  echo "$(dirname "$HIPCONFIG")" >> "$GITHUB_PATH"
                  echo "$ROCM_DIR/bin" >> "$GITHUB_PATH"
                  echo "HIP_PATH=$ROCM_DIR" >> "$GITHUB_ENV"
                  echo "ROCM_PATH=$ROCM_DIR" >> "$GITHUB_ENV"
                  # This ROCm layout ships hipconfig but omits the share/hip/version
                  # file it reads, so `hipconfig --version` warns on stderr and
                  # cubecl-hip-sys panics (it treats any stderr as fatal). Rebuild
                  # the file from hip_version.h — the same header the bindings were
                  # generated against, so the reported patch matches exactly.
                  VER_FILE="$ROCM_DIR/share/hip/version"
                  if [ ! -f "$VER_FILE" ]; then
                      # Prefer the real header if present; otherwise this is a
                      # runtime-only install (cubecl-hip-sys ships pre-generated
                      # bindings and only links libamdhip64, so headers may be
                      # absent). cubecl reads the *patch* from `hipconfig` and
                      # enables hip_<patch>; we pin the AMD repo to 7.1.1 and the
                      # crate to 7.1.5280200 whose sole HIP feature is hip_52802,
                      # so that patch is fixed.
                      HDR="$(find "$ROCM_DIR" -name hip_version.h 2>/dev/null | head -n1)"
                      if [ -n "$HDR" ]; then
                          MAJ="$(awk '/define HIP_VERSION_MAJOR/{print $3}' "$HDR")"
                          MIN="$(awk '/define HIP_VERSION_MINOR/{print $3}' "$HDR")"
                          PAT="$(awk '/define HIP_VERSION_PATCH/{print $3}' "$HDR")"
                          GIT="$(awk '/define HIP_VERSION_GITHASH/{gsub(/"/,"",$3);print $3}' "$HDR")"
                      else
                          MAJ=7; MIN=1; PAT=52802; GIT=""
                      fi
                      [ -n "$GIT" ] || GIT=rocm711
                      echo "Synthesizing $VER_FILE: $MAJ.$MIN.$PAT-$GIT"
                      sudo mkdir -p "$(dirname "$VER_FILE")"
                      printf 'HIP_VERSION_MAJOR=%s\nHIP_VERSION_MINOR=%s\nHIP_VERSION_PATCH=%s\nHIP_VERSION_GITHASH=%s\n' \
                          "$MAJ" "$MIN" "$PAT" "$GIT" | sudo tee "$VER_FILE" >/dev/null
                  fi
                  # Must print the version with empty stderr or cubecl-hip-sys panics.
                  "$HIPCONFIG" --version

            # Each runner builds its own native target; no cross toolchain needed.
            - name: Build hub dist profile
              run: cargo xtask dist --profile ${{ matrix.profile }}

            # bash, not pwsh: PowerShell isn't present in the L4T container.
            - name: Check hub dist layout
              shell: bash
              run: |
                  set -euo pipefail
                  art="dist/lumen-hub-${{ matrix.profile }}"
                  test -f "$art/README.md"
                  test -f "$art/LICENSE"
                  test -d "$art/bin"
                  if [ "${RUNNER_OS:-}" = "Windows" ]; then
                    test -f "$art/bin/lumen-hub.exe"
                  else
                    test -f "$art/bin/lumen-hub"
                  fi

            - uses: actions/upload-artifact@v4
              with:
                  name: hub-${{ matrix.profile }}
                  path: dist/lumen-hub-${{ matrix.profile }}.zip
                  if-no-files-found: error

    cli-local:
        name: cli-${{ matrix.target }}
        runs-on: ${{ matrix.os }}
        needs:
            - validate-release
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: aarch64-apple-darwin
                      os: macos-14
                      archive: lumen-cli-aarch64-apple-darwin.tar.xz
                    - target: x86_64-unknown-linux-gnu
                      os: ubuntu-22.04
                      archive: lumen-cli-x86_64-unknown-linux-gnu.tar.xz
                    - target: aarch64-unknown-linux-gnu
                      os: ubuntu-22.04-arm
                      archive: lumen-cli-aarch64-unknown-linux-gnu.tar.xz
                    - target: x86_64-pc-windows-msvc
                      os: windows-2022
                      archive: lumen-cli-x86_64-pc-windows-msvc.zip

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@stable

            - name: Install cargo-dist
              if: runner.os != 'Windows'
              run: |
                  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

            - name: Install cargo-dist
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  irm https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.ps1 | iex
                  "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

            - name: Build lumen-cli with cargo-dist
              shell: bash
              run: |
                  dist build --artifacts=local --target=${{ matrix.target }} --tag="$RELEASE_TAG" --allow-dirty --output-format=json > dist-manifest.json
                  cp dist-manifest.json "target/distrib/${{ matrix.target }}-dist-manifest.json"

            - uses: actions/upload-artifact@v4
              with:
                  name: cli-${{ matrix.target }}
                  path: |
                      target/distrib/${{ matrix.archive }}
                      target/distrib/${{ matrix.archive }}.sha256
                      target/distrib/${{ matrix.target }}-dist-manifest.json
                  if-no-files-found: error

    cli-global:
        name: cli-installers
        runs-on: ubuntu-22.04
        needs:
            - cli-local

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@stable

            - name: Download CLI archives
              uses: actions/download-artifact@v4
              with:
                  pattern: cli-*
                  path: target/distrib
                  merge-multiple: true

            - name: Install cargo-dist
              run: |
                  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

            - name: Build lumen-cli installers with cargo-dist
              run: dist build --artifacts=global --tag="$RELEASE_TAG" --allow-dirty

            - uses: actions/upload-artifact@v4
              with:
                  name: cli-installers
                  path: |
                      target/distrib/lumen-cli-installer.sh
                      target/distrib/lumen-cli-installer.ps1
                      target/distrib/sha256.sum
                  if-no-files-found: error

    metadata:
        name: metadata
        runs-on: ubuntu-24.04
        needs:
            - dist
            - cli-local
            - cli-global

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.94.1"

            - name: Download archives
              uses: actions/download-artifact@v4
              with:
                  path: release-assets
                  merge-multiple: true

            - name: Generate hub manifest and top-level checksums
              env:
                  LUMEN_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
                  LUMEN_RELEASE_BASE_URL: https://github.com/EdwinZhanCN/Lumen-Hub/releases/download/${{ env.RELEASE_TAG }}
              run: cargo xtask release-metadata --assets-dir release-assets

            - uses: actions/upload-artifact@v4
              with:
                  name: metadata
                  path: |
                      release-assets/manifest.json
                      release-assets/checksums.txt
                  if-no-files-found: error

    release:
        name: ${{ github.event_name == 'workflow_dispatch' && 'Validate release assets' || 'Create GitHub Release' }}
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        needs:
            - dist
            - cli-local
            - cli-global
            - metadata
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

        steps:
            - name: Download release assets
              uses: actions/download-artifact@v4
              with:
                  path: release-assets
                  merge-multiple: true

            - name: Check release assets
              run: |
                  set -euo pipefail
                  for p in darwin-arm64-metal darwin-arm64-cpu \
                           windows-x64-cpu windows-x64-gpu \
                           linux-x64-cpu linux-x64-gpu linux-x64-cuda linux-x64-rocm \
                           linux-arm64-cpu linux-arm64-gpu linux-arm64-jetson; do
                    test -f "release-assets/lumen-hub-${p}.zip"
                  done
                  test -f release-assets/lumen-cli-installer.sh
                  test -f release-assets/lumen-cli-installer.ps1
                  test -f release-assets/sha256.sum
                  test -f release-assets/manifest.json
                  test -f release-assets/checksums.txt
                  ls -lah release-assets

            - name: Build release body
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ env.RELEASE_TAG }}
                  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
              run: |
                  set -euo pipefail
                  if [[ "$DRY_RUN" == "true" ]]; then
                    echo "Manual dry run for ${TAG}; generated release notes are deferred until tag publication." > generated-notes.md
                  else
                    gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                      -f tag_name="$TAG" \
                      --jq .body > generated-notes.md
                  fi
                  cat > release-body.md <<EOF
                  # ${TAG}

                  ## Install

                  macOS/Linux:
                  \`\`\`bash
                  curl --proto '=https' --tlsv1.2 -LsSf https://lumilio.org/lumen/install.sh | sh
                  lumen-cli init
                  lumen-cli start
                  \`\`\`

                  Windows:
                  \`\`\`powershell
                  powershell -ExecutionPolicy Bypass -c "irm https://lumilio.org/lumen/install.ps1 | iex"
                  lumen-cli init
                  lumen-cli start
                  \`\`\`

                  ## Hub artifacts (Burn backends)

                  | Profile | Backend | Archive |
                  |---|---|---|
                  | \`darwin-arm64-metal\` | Metal | \`lumen-hub-darwin-arm64-metal.zip\` |
                  | \`darwin-arm64-cpu\` | CPU | \`lumen-hub-darwin-arm64-cpu.zip\` |
                  | \`windows-x64-cpu\` | CPU | \`lumen-hub-windows-x64-cpu.zip\` |
                  | \`windows-x64-gpu\` | wgpu (DX12/Vulkan) | \`lumen-hub-windows-x64-gpu.zip\` |
                  | \`linux-x64-cpu\` | CPU | \`lumen-hub-linux-x64-cpu.zip\` |
                  | \`linux-x64-gpu\` | wgpu (Vulkan/GL) | \`lumen-hub-linux-x64-gpu.zip\` |
                  | \`linux-x64-cuda\` | CUDA | \`lumen-hub-linux-x64-cuda.zip\` |
                  | \`linux-x64-rocm\` | ROCm | \`lumen-hub-linux-x64-rocm.zip\` |
                  | \`linux-arm64-cpu\` | CPU | \`lumen-hub-linux-arm64-cpu.zip\` |
                  | \`linux-arm64-gpu\` | wgpu (Vulkan/GL) | \`lumen-hub-linux-arm64-gpu.zip\` |
                  | \`linux-arm64-jetson\` | CUDA (L4T) | \`lumen-hub-linux-arm64-jetson.zip\` |

                  ## Generated Notes
                  EOF
                  cat generated-notes.md >> release-body.md

            - name: Confirm dry run has no release side effects
              if: github.event_name == 'workflow_dispatch'
              run: echo "Release assets and release body validated; GitHub Release creation is disabled for this run."

            - name: Create release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
                  fail_on_unmatched_files: true
                  body_path: release-body.md
                  files: |
                      release-assets/lumen-hub-darwin-arm64-metal.zip
                      release-assets/lumen-hub-darwin-arm64-cpu.zip
                      release-assets/lumen-hub-windows-x64-cpu.zip
                      release-assets/lumen-hub-windows-x64-gpu.zip
                      release-assets/lumen-hub-linux-x64-cpu.zip
                      release-assets/lumen-hub-linux-x64-gpu.zip
                      release-assets/lumen-hub-linux-x64-cuda.zip
                      release-assets/lumen-hub-linux-x64-rocm.zip
                      release-assets/lumen-hub-linux-arm64-cpu.zip
                      release-assets/lumen-hub-linux-arm64-gpu.zip
                      release-assets/lumen-hub-linux-arm64-jetson.zip
                      release-assets/lumen-cli-aarch64-apple-darwin.tar.xz
                      release-assets/lumen-cli-aarch64-apple-darwin.tar.xz.sha256
                      release-assets/lumen-cli-aarch64-unknown-linux-gnu.tar.xz
                      release-assets/lumen-cli-aarch64-unknown-linux-gnu.tar.xz.sha256
                      release-assets/lumen-cli-x86_64-unknown-linux-gnu.tar.xz
                      release-assets/lumen-cli-x86_64-unknown-linux-gnu.tar.xz.sha256
                      release-assets/lumen-cli-x86_64-pc-windows-msvc.zip
                      release-assets/lumen-cli-x86_64-pc-windows-msvc.zip.sha256
                      release-assets/lumen-cli-installer.sh
                      release-assets/lumen-cli-installer.ps1
                      release-assets/sha256.sum
                      release-assets/manifest.json
                      release-assets/checksums.txt

    # Container images for Linux servers / NAS, assembled from the prebuilt hub
    # dist artifacts (no recompilation). Three flavors (see packaging/docker/):
    #   cpu    = linux-{x64,arm64}-cpu, multi-arch, also tagged `latest`
    #   vulkan = linux-x64-gpu + Mesa ICDs (Intel iGPU via ANV, AMD via RADV)
    #   cuda   = linux-x64-cuda on the NVIDIA base image plus NVRTC only
    docker:
        name: docker-images
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        needs:
            - dist
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Download hub Linux archives
              uses: actions/download-artifact@v4
              with:
                  pattern: hub-linux-*
                  path: dist
                  merge-multiple: true

            - name: Stage per-platform build contexts
              run: |
                  set -euo pipefail
                  stage() { # zip-profile dest-dir
                    unzip -q "dist/lumen-hub-$1.zip" -d dist/docker-tmp
                    mv "dist/docker-tmp/lumen-hub-$1" "dist/docker/$2"
                    rm -rf dist/docker-tmp
                  }
                  mkdir -p dist/docker
                  stage linux-x64-cpu   linux-amd64
                  stage linux-arm64-cpu linux-arm64
                  stage linux-x64-gpu   vulkan
                  stage linux-x64-cuda  cuda

            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              if: startsWith(github.ref, 'refs/tags/')
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare image metadata
              id: docker-meta
              env:
                  TAG: ${{ env.RELEASE_TAG }}
              run: |
                  set -euo pipefail
                  echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lumen-hub" >> "$GITHUB_OUTPUT"
                  echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

            # Using the official build action is important here: it injects the
            # GitHub cache URL/token required by the `type=gha` backend.
            - name: Build CPU image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: packaging/docker/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.event_name != 'workflow_dispatch' }}
                  build-args: |
                      FLAVOR=cpu
                      VERSION=${{ steps.docker-meta.outputs.version }}
                      REVISION=${{ github.sha }}
                  tags: |
                      ${{ steps.docker-meta.outputs.image }}:${{ steps.docker-meta.outputs.version }}-cpu
                      ${{ steps.docker-meta.outputs.image }}:cpu
                      ${{ steps.docker-meta.outputs.image }}:latest
                  cache-from: type=gha,scope=lumen-hub-cpu
                  cache-to: type=gha,mode=max,scope=lumen-hub-cpu

            - name: Build Vulkan image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: packaging/docker/Dockerfile
                  platforms: linux/amd64
                  push: ${{ github.event_name != 'workflow_dispatch' }}
                  build-args: |
                      FLAVOR=vulkan
                      DIST=dist/docker/vulkan
                      VERSION=${{ steps.docker-meta.outputs.version }}
                      REVISION=${{ github.sha }}
                  tags: |
                      ${{ steps.docker-meta.outputs.image }}:${{ steps.docker-meta.outputs.version }}-vulkan
                      ${{ steps.docker-meta.outputs.image }}:vulkan
                  cache-from: type=gha,scope=lumen-hub-vulkan
                  cache-to: type=gha,mode=max,scope=lumen-hub-vulkan

            - name: Build CUDA image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: packaging/docker/Dockerfile
                  platforms: linux/amd64
                  push: ${{ github.event_name != 'workflow_dispatch' }}
                  build-args: |
                      FLAVOR=cuda
                      BASE=nvidia/cuda:12.6.3-base-ubuntu24.04
                      DIST=dist/docker/cuda
                      VERSION=${{ steps.docker-meta.outputs.version }}
                      REVISION=${{ github.sha }}
                  tags: |
                      ${{ steps.docker-meta.outputs.image }}:${{ steps.docker-meta.outputs.version }}-cuda
                      ${{ steps.docker-meta.outputs.image }}:cuda
                  cache-from: type=gha,scope=lumen-hub-cuda
                  cache-to: type=gha,mode=max,scope=lumen-hub-cuda
