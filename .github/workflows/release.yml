name: Release Profiles

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            release_tag:
                description: Planned release tag for the dry run (for example, v0.1.0)
                required: true
                type: string

permissions:
    contents: read

env:
    RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
    validate-release:
        name: validate-release-input
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Validate planned release tag
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                    echo "release tag must look like v0.1.0 or v0.1.0-rc.1: $RELEASE_TAG" >&2
                    exit 1
                  fi
                  PACKAGE_VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' crates/lumen-cli/Cargo.toml | head -n1)"
                  if [[ -z "$PACKAGE_VERSION" || "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
                    echo "release tag $RELEASE_TAG does not match lumen-cli version ${PACKAGE_VERSION:-unknown}" >&2
                    exit 1
                  fi
                  echo "Release build tag: $RELEASE_TAG"
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                    echo "Mode: dry run (no GitHub Release and no container push)"
                  else
                    echo "Mode: publish"
                  fi

    # The release surface is deliberately smaller than xtask's source-build
    # profile table. Desktop profiles plus the Linux CPU/Vulkan/CUDA paths are
    # published; ROCm, generic arm64 GPU, and Jetson remain source recipes until
    # they have a continuously exercised owner.
    dist:
        name: hub-${{ matrix.profile }}
        runs-on: ${{ matrix.os }}
        needs:
            - validate-release
        strategy:
            fail-fast: false
            matrix:
                include:
                    # macOS
                    - { profile: darwin-arm64-metal, os: macos-15 }
                    - { profile: darwin-arm64-cpu, os: macos-15 }
                    # Windows
                    - { profile: windows-x64-cpu, os: windows-2025 }
                    - { profile: windows-x64-gpu, os: windows-2025 }
                    # Linux x64 is built on Ubuntu 22.04 to keep the glibc floor
                    # below the current hosted-runner default.
                    - { profile: linux-x64-cpu, os: ubuntu-22.04 }
                    - { profile: linux-x64-gpu, os: ubuntu-22.04 }
                    - { profile: linux-x64-cuda, os: ubuntu-22.04, toolkit: cuda }
                    # Linux arm64
                    - { profile: linux-arm64-cpu, os: ubuntu-22.04-arm }

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.94.1"

            - name: Install CUDA toolkit
              if: matrix.toolkit == 'cuda'
              uses: Jimver/cuda-toolkit@v0.2.21
              with:
                  method: network

            # Each runner builds its own native target; no cross toolchain needed.
            - name: Build hub dist profile
              run: cargo xtask dist --profile ${{ matrix.profile }}

            # Use one layout check across all hosted runners.
            - name: Check hub dist layout
              shell: bash
              run: |
                  set -euo pipefail
                  art="dist/lumen-hub-${{ matrix.profile }}"
                  test -f "$art/README.md"
                  test -f "$art/LICENSE"
                  test -d "$art/bin"
                  if [ "${RUNNER_OS:-}" = "Windows" ]; then
                    test -f "$art/bin/lumen-hub.exe"
                  else
                    test -f "$art/bin/lumen-hub"
                  fi

            - uses: actions/upload-artifact@v4
              with:
                  name: hub-${{ matrix.profile }}
                  path: dist/lumen-hub-${{ matrix.profile }}.zip
                  if-no-files-found: error

    cli-local:
        name: cli-${{ matrix.target }}
        runs-on: ${{ matrix.os }}
        needs:
            - validate-release
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: aarch64-apple-darwin
                      os: macos-14
                      archive: lumen-cli-aarch64-apple-darwin.tar.xz
                    - target: x86_64-unknown-linux-gnu
                      os: ubuntu-22.04
                      archive: lumen-cli-x86_64-unknown-linux-gnu.tar.xz
                    - target: aarch64-unknown-linux-gnu
                      os: ubuntu-22.04-arm
                      archive: lumen-cli-aarch64-unknown-linux-gnu.tar.xz
                    - target: x86_64-pc-windows-msvc
                      os: windows-2022
                      archive: lumen-cli-x86_64-pc-windows-msvc.zip

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@stable

            - name: Install cargo-dist
              if: runner.os != 'Windows'
              run: |
                  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

            - name: Install cargo-dist
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  irm https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.ps1 | iex
                  "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

            - name: Build lumen-cli with cargo-dist
              shell: bash
              run: |
                  dist build --artifacts=local --target=${{ matrix.target }} --tag="$RELEASE_TAG" --allow-dirty --output-format=json > dist-manifest.json
                  cp dist-manifest.json "target/distrib/${{ matrix.target }}-dist-manifest.json"

            - uses: actions/upload-artifact@v4
              with:
                  name: cli-${{ matrix.target }}
                  path: |
                      target/distrib/${{ matrix.archive }}
                      target/distrib/${{ matrix.archive }}.sha256
                      target/distrib/${{ matrix.target }}-dist-manifest.json
                  if-no-files-found: error

    cli-global:
        name: cli-installers
        runs-on: ubuntu-22.04
        needs:
            - cli-local

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@stable

            - name: Download CLI archives
              uses: actions/download-artifact@v4
              with:
                  pattern: cli-*
                  path: target/distrib
                  merge-multiple: true

            - name: Install cargo-dist
              run: |
                  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

            - name: Build lumen-cli installers with cargo-dist
              run: dist build --artifacts=global --tag="$RELEASE_TAG" --allow-dirty

            - uses: actions/upload-artifact@v4
              with:
                  name: cli-installers
                  path: |
                      target/distrib/lumen-cli-installer.sh
                      target/distrib/lumen-cli-installer.ps1
                      target/distrib/sha256.sum
                  if-no-files-found: error

    metadata:
        name: metadata
        runs-on: ubuntu-24.04
        needs:
            - dist
            - cli-local
            - cli-global

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.94.1"

            - name: Download archives
              uses: actions/download-artifact@v4
              with:
                  path: release-assets
                  merge-multiple: true

            - name: Generate hub manifest and top-level checksums
              env:
                  LUMEN_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
                  LUMEN_RELEASE_BASE_URL: https://github.com/EdwinZhanCN/Lumen-Hub/releases/download/${{ env.RELEASE_TAG }}
              run: cargo xtask release-metadata --assets-dir release-assets

            - uses: actions/upload-artifact@v4
              with:
                  name: metadata
                  path: |
                      release-assets/manifest.json
                      release-assets/SHA256SUMS
                  if-no-files-found: error

    release:
        name: ${{ github.event_name == 'workflow_dispatch' && 'Validate release assets' || 'Create GitHub Release' }}
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        needs:
            - dist
            - cli-local
            - cli-global
            - metadata
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

        steps:
            - name: Download release assets
              uses: actions/download-artifact@v4
              with:
                  path: release-assets
                  merge-multiple: true

            - name: Check release assets
              run: |
                  set -euo pipefail
                  for p in darwin-arm64-metal darwin-arm64-cpu \
                           windows-x64-cpu windows-x64-gpu \
                           linux-x64-cpu linux-x64-gpu linux-x64-cuda \
                           linux-arm64-cpu; do
                    test -f "release-assets/lumen-hub-${p}.zip"
                  done
                  test -f release-assets/lumen-cli-installer.sh
                  test -f release-assets/lumen-cli-installer.ps1
                  test -f release-assets/sha256.sum
                  test -f release-assets/manifest.json
                  test -f release-assets/SHA256SUMS
                  ls -lah release-assets

            - name: Build release body
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ env.RELEASE_TAG }}
                  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
              run: |
                  set -euo pipefail
                  if [[ "$DRY_RUN" == "true" ]]; then
                    echo "Manual dry run for ${TAG}; generated release notes are deferred until tag publication." > generated-notes.md
                  else
                    gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                      -f tag_name="$TAG" \
                      --jq .body > generated-notes.md
                  fi
                  cat > release-body.md <<EOF
                  # ${TAG}

                  ## Install

                  macOS/Linux:
                  \`\`\`bash
                  curl --proto '=https' --tlsv1.2 -LsSf https://lumilio.org/lumen/install.sh | sh
                  lumen-cli init
                  lumen-cli start
                  \`\`\`

                  Windows:
                  \`\`\`powershell
                  powershell -ExecutionPolicy Bypass -c "irm https://lumilio.org/lumen/install.ps1 | iex"
                  lumen-cli init
                  lumen-cli start
                  \`\`\`

                  ## Hub artifacts (Burn backends)

                  | Profile | Backend | Archive |
                  |---|---|---|
                  | \`darwin-arm64-metal\` | Metal | \`lumen-hub-darwin-arm64-metal.zip\` |
                  | \`darwin-arm64-cpu\` | CPU | \`lumen-hub-darwin-arm64-cpu.zip\` |
                  | \`windows-x64-cpu\` | CPU | \`lumen-hub-windows-x64-cpu.zip\` |
                  | \`windows-x64-gpu\` | wgpu (DX12/Vulkan) | \`lumen-hub-windows-x64-gpu.zip\` |
                  | \`linux-x64-cpu\` | CPU | \`lumen-hub-linux-x64-cpu.zip\` |
                  | \`linux-x64-gpu\` | wgpu (Vulkan/GL) | \`lumen-hub-linux-x64-gpu.zip\` |
                  | \`linux-x64-cuda\` | CUDA | \`lumen-hub-linux-x64-cuda.zip\` |
                  | \`linux-arm64-cpu\` | CPU | \`lumen-hub-linux-arm64-cpu.zip\` |

                  ROCm, generic Linux arm64 GPU, and Jetson profiles remain
                  source-build recipes and are not release artifacts.

                  ## Generated Notes
                  EOF
                  cat generated-notes.md >> release-body.md

            - name: Confirm dry run has no release side effects
              if: github.event_name == 'workflow_dispatch'
              run: echo "Release assets and release body validated; GitHub Release creation is disabled for this run."

            - name: Create release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
                  fail_on_unmatched_files: true
                  body_path: release-body.md
                  files: |
                      release-assets/lumen-hub-darwin-arm64-metal.zip
                      release-assets/lumen-hub-darwin-arm64-cpu.zip
                      release-assets/lumen-hub-windows-x64-cpu.zip
                      release-assets/lumen-hub-windows-x64-gpu.zip
                      release-assets/lumen-hub-linux-x64-cpu.zip
                      release-assets/lumen-hub-linux-x64-gpu.zip
                      release-assets/lumen-hub-linux-x64-cuda.zip
                      release-assets/lumen-hub-linux-arm64-cpu.zip
                      release-assets/lumen-cli-aarch64-apple-darwin.tar.xz
                      release-assets/lumen-cli-aarch64-apple-darwin.tar.xz.sha256
                      release-assets/lumen-cli-aarch64-unknown-linux-gnu.tar.xz
                      release-assets/lumen-cli-aarch64-unknown-linux-gnu.tar.xz.sha256
                      release-assets/lumen-cli-x86_64-unknown-linux-gnu.tar.xz
                      release-assets/lumen-cli-x86_64-unknown-linux-gnu.tar.xz.sha256
                      release-assets/lumen-cli-x86_64-pc-windows-msvc.zip
                      release-assets/lumen-cli-x86_64-pc-windows-msvc.zip.sha256
                      release-assets/lumen-cli-installer.sh
                      release-assets/lumen-cli-installer.ps1
                      release-assets/sha256.sum
                      release-assets/manifest.json
                      release-assets/SHA256SUMS

    # Container images for Linux servers / NAS, assembled from the prebuilt hub
    # dist artifacts (no recompilation). Three flavors (see packaging/docker/):
    #   cpu    = linux-{x64,arm64}-cpu, multi-arch, also tagged `latest`
    #   vulkan = linux-x64-gpu + Mesa ICDs (Intel iGPU via ANV, AMD via RADV)
    #   cuda   = linux-x64-cuda on the NVIDIA base image plus NVRTC only
    docker:
        name: docker-images
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        needs:
            - dist
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Download hub Linux archives
              uses: actions/download-artifact@v4
              with:
                  pattern: hub-linux-*
                  path: dist
                  merge-multiple: true

            - name: Stage per-platform build contexts
              run: |
                  set -euo pipefail
                  stage() { # zip-profile dest-dir
                    unzip -q "dist/lumen-hub-$1.zip" -d dist/docker-tmp
                    mv "dist/docker-tmp/lumen-hub-$1" "dist/docker/$2"
                    rm -rf dist/docker-tmp
                  }
                  mkdir -p dist/docker
                  stage linux-x64-cpu   linux-amd64
                  stage linux-arm64-cpu linux-arm64
                  stage linux-x64-gpu   vulkan
                  stage linux-x64-cuda  cuda

            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              if: startsWith(github.ref, 'refs/tags/')
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare image metadata
              id: docker-meta
              env:
                  TAG: ${{ env.RELEASE_TAG }}
              run: |
                  set -euo pipefail
                  echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lumen-hub" >> "$GITHUB_OUTPUT"
                  echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

            # Using the official build action is important here: it injects the
            # GitHub cache URL/token required by the `type=gha` backend.
            - name: Build CPU image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: packaging/docker/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.event_name != 'workflow_dispatch' }}
                  build-args: |
                      FLAVOR=cpu
                      VERSION=${{ steps.docker-meta.outputs.version }}
                      REVISION=${{ github.sha }}
                  tags: |
                      ${{ steps.docker-meta.outputs.image }}:${{ steps.docker-meta.outputs.version }}-cpu
                      ${{ steps.docker-meta.outputs.image }}:cpu
                      ${{ steps.docker-meta.outputs.image }}:latest
                  cache-from: type=gha,scope=lumen-hub-cpu
                  cache-to: type=gha,mode=max,scope=lumen-hub-cpu

            - name: Build Vulkan image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: packaging/docker/Dockerfile
                  platforms: linux/amd64
                  push: ${{ github.event_name != 'workflow_dispatch' }}
                  build-args: |
                      FLAVOR=vulkan
                      DIST=dist/docker/vulkan
                      VERSION=${{ steps.docker-meta.outputs.version }}
                      REVISION=${{ github.sha }}
                  tags: |
                      ${{ steps.docker-meta.outputs.image }}:${{ steps.docker-meta.outputs.version }}-vulkan
                      ${{ steps.docker-meta.outputs.image }}:vulkan
                  cache-from: type=gha,scope=lumen-hub-vulkan
                  cache-to: type=gha,mode=max,scope=lumen-hub-vulkan

            - name: Build CUDA image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: packaging/docker/Dockerfile
                  platforms: linux/amd64
                  push: ${{ github.event_name != 'workflow_dispatch' }}
                  build-args: |
                      FLAVOR=cuda
                      BASE=nvidia/cuda:12.6.3-base-ubuntu24.04
                      DIST=dist/docker/cuda
                      VERSION=${{ steps.docker-meta.outputs.version }}
                      REVISION=${{ github.sha }}
                  tags: |
                      ${{ steps.docker-meta.outputs.image }}:${{ steps.docker-meta.outputs.version }}-cuda
                      ${{ steps.docker-meta.outputs.image }}:cuda
                  cache-from: type=gha,scope=lumen-hub-cuda
                  cache-to: type=gha,mode=max,scope=lumen-hub-cuda
