name: Remote Proto Contract

on:
    workflow_dispatch:
    pull_request:
        paths:
            - "crates/lumen-hub/proto/**"
            - "crates/lumen-schema/src/manifest.rs"
            - "crates/xtask/src/main.rs"
            - ".github/workflows/proto-contract.yml"
    push:
        branches: [main]
        paths:
            - "crates/lumen-hub/proto/**"
            - "crates/lumen-schema/src/manifest.rs"
            - "crates/xtask/src/main.rs"
            - ".github/workflows/proto-contract.yml"

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.94.1"
            - uses: Swatinem/rust-cache@v2
            - name: Install buf
              run: |
                  curl -sSL https://github.com/bufbuild/buf/releases/download/v1.72.0/buf-Linux-x86_64 -o /usr/local/bin/buf
                  chmod +x /usr/local/bin/buf
                  buf --version
            - name: Verify SDK provenance and WIRE_JSON baseline
              run: cargo run -q -p xtask -- contract-verify
