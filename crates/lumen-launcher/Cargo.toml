[package]
name = "lumen-launcher"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/EdwinZhanCN/Lumen-Hub"

[package.metadata.dist]
dist = false

[dependencies]
flate2 = "1.1.9"
lumen-schema = { path = "../lumen-schema" }
prost = "0.14.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tar = "0.4.44"
thiserror = "2.0.18"
tokio = { version = "1.51.1", features = ["rt", "time"] }
tonic = { version = "0.14.5", features = ["transport"] }
tonic-prost = "0.14.5"
ureq = "3.3.0"
zip = "6.0.0"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
